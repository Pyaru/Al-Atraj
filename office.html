<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Al Atraj Documents</title>
<link rel="icon" href="images/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="office-config.js"></script>
<script src="config.js"></script>
<script src="pricelist.js"></script>
<style>
:root{
  --ink:#10302B; --ink-2:#1B4E46; --ground:#EEF1F0; --white:#fff; --line:#C5D1CC;
  --muted:#4A5F5A; --brass:#D6A94E; --green:#12804A; --red:#B3261E; --focus:#D6A94E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30}
.top .in{max-width:1400px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.top h1{margin:0;font-size:18px;white-space:nowrap}
.search{position:relative;flex:1 1 280px;max-width:560px}
.search input{width:100%;min-height:44px;padding:0 14px;border:2px solid transparent;border-radius:4px;background:#fff;color:var(--ink)}
.results{position:absolute;left:0;right:0;top:48px;background:#fff;color:var(--ink);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-height:60vh;overflow:auto;z-index:40}
.results button{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover{background:#EEF4F2}
.results .n{font-weight:700}
.results .m{font-size:13px;color:var(--muted)}
.results .empty{padding:14px;color:var(--muted)}
.banner{background:#FFF3CD;color:#5A4300;padding:10px max(16px,env(safe-area-inset-left,0px));font-size:14px}

/* layout */
.app{max-width:1400px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:1100px){.app{grid-template-columns:minmax(420px,520px) minmax(0,1fr);align-items:start}.prevcol{position:sticky;top:76px}}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{min-height:44px;padding:8px 10px;border:1px solid #8DA39B;border-radius:4px;background:#fff;color:var(--ink);font-weight:400;font-size:16px;width:100%}
label.f textarea{min-height:64px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:20px;height:20px}
.typebox select{font-weight:700;font-size:17px}

/* items */
.item{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:8px;background:#FAFBFA}
.item .no{font-weight:700;padding-top:12px;text-align:center}
.item .rest{grid-column:2;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr);gap:8px}
.item .desc{grid-column:2}
.item .del{grid-row:1;grid-column:3;min-height:44px;background:none;border:1px solid var(--line);border-radius:4px;color:var(--red);cursor:pointer;font-size:20px}
.item .amt{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.item .amt output{min-height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.totals{display:grid;gap:6px;margin-top:12px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;font-size:15px}
.totals .g{font-size:18px;font-weight:700;border-top:2px solid var(--ink);padding-top:6px}

/* customer suggestions */
.sugg{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid #8DA39B;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:260px;overflow:auto;margin-top:2px}
.sugg button{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.sugg button:hover{background:#EEF4F2}
.sugg .n{font-weight:700;color:var(--ink)}.sugg .m{font-size:13px;color:var(--muted);font-weight:400}
/* payments, chips, search tabs */
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;margin-inline-start:6px;vertical-align:1px}
.chip.paid{background:#D7F0E2;color:#0C5C34}.chip.partial{background:#FFF0C2;color:#7A5400}.chip.unpaid{background:#FBDADA;color:#8E1F1F}
.pay-sum{display:grid;gap:4px;font-variant-numeric:tabular-nums;margin-bottom:12px}
.pay-sum div{display:flex;justify-content:space-between}
.pay-sum .b{font-weight:700;font-size:18px;border-top:2px solid var(--ink);padding-top:4px}
.pay-list{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:6px}
.pay-list li{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:14px}
.pay-list button{min-height:36px;min-width:36px;background:none;border:1px solid var(--line);border-radius:4px;color:var(--red);cursor:pointer;font-size:18px}
.pay-hint{color:var(--muted);font-size:14px}
.results .tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.results .tabs button{display:inline-block;width:auto;padding:6px 12px;border:2px solid var(--ink);border-radius:4px;font-weight:700;font-size:14px}
.results .tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.results .sum{padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}

/* buttons */
.btn{min-height:46px;padding:0 18px;border-radius:4px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}
.btn.wa{background:var(--green);border-color:var(--green);color:#fff}
.btn:disabled{opacity:.55;cursor:wait}
.add{width:100%;border-style:dashed}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.12);z-index:30;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bar .in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bar .btn{flex:1 1 90px;max-width:200px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;max-width:92vw;background:#222;color:#fff;padding:12px 16px;border-radius:6px;z-index:60;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.err{background:var(--red)}
.toast button{margin-left:12px;min-height:36px;padding:0 12px;border:0;border-radius:4px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}

/* PIN gate */
.gate{position:fixed;inset:0;background:var(--ink);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.gate form{background:#fff;border-radius:8px;padding:24px;width:100%;max-width:360px;display:grid;gap:14px}
.gate h2{margin:0;font-size:20px}
.gate .err{color:var(--red);font-size:14px;min-height:20px}

/* A4 preview */
.prevhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:14px;color:var(--muted)}
.paper-wrap{position:relative;overflow:hidden;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);margin:0 auto}
.sheet{width:794px;min-height:1123px;padding:44px 48px 36px;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.35;position:relative;transform-origin:top left}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.sh-co{font-size:12px;line-height:1.6}
.sh-co .nm{font-size:24px;color:#1F2A8C;line-height:1.2;margin-bottom:4px}
.sh-co b{font-weight:700}
.sh-logo{height:92px;width:auto;display:block}
.sh-title{text-align:center;font-size:21px;text-decoration:underline;margin:26px 0 20px;font-weight:400;letter-spacing:.02em}
.sh-two{display:flex;justify-content:space-between;gap:24px;margin-bottom:18px}
.sh-party{flex:1;min-width:0;font-size:13px;line-height:1.5;white-space:pre-line}
.sh-party .nm{font-weight:700;font-size:14px;text-transform:uppercase}
.sh-party .lb{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.06em}
.sh-meta{flex:0 0 38%;margin-left:auto;display:grid;grid-template-columns:auto 12px 1fr;gap:5px 0;font-size:13px;align-content:start}
.sh-meta .v{font-weight:400;overflow-wrap:anywhere}
.sh-msg{margin:6px 0 16px;white-space:pre-line}
.sh-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.sh-tbl th,.sh-tbl td{border:1px solid #000;padding:6px 7px;vertical-align:top;font-size:12.5px}
.sh-tbl th{text-align:center;font-weight:700;padding:8px 6px}
.sh-tbl td.c{text-align:center}
.sh-tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.sh-tbl td.d{white-space:pre-line;overflow-wrap:anywhere}
.sh-tbl tr.pad td{height:26px}
.sh-note{border:1px solid #000;border-top:0;padding:14px 18px;min-height:46px;font-weight:700;white-space:pre-line}
.sh-words{margin:10px 0 0;font-weight:700;font-size:12px}
.sh-bank{margin-top:14px;border:1px solid #000;font-size:11px;break-inside:avoid}
.sh-bank h4{margin:0;text-align:center;font-size:12px;padding:5px;border-bottom:1px solid #000}
.sh-bank .bk{display:grid;grid-template-columns:1fr 1fr}
.sh-bank .bk div{padding:3px 10px}
.sh-bank .tc{border-top:1px solid #000;padding:5px 10px}
.sh-bank .tc b{display:block;margin-bottom:2px}
.sh-bank .tc ol{margin:0;padding-left:16px}
.sh-tot{margin:0 0 0 auto;width:46%;border-collapse:collapse}
.sh-tot td{border:1px solid #000;border-top:0;padding:7px 8px;font-weight:700;font-size:12.5px}
.sh-tot td.r{text-align:right;font-variant-numeric:tabular-nums}
.sh-sign{display:flex;justify-content:space-between;gap:20px;margin-top:70px;font-weight:700;position:relative}
.sh-stamp{position:absolute;left:28%;bottom:18px;height:120px;width:auto;opacity:.92}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .noprint,.top,.bar,.toast,.banner,.gate{display:none!important}
  .app{display:block;padding:0;max-width:none}
  .prevcol{position:static}
  .paper-wrap{box-shadow:none;width:auto!important;height:auto!important;overflow:visible}
  .sheet{transform:none!important;width:210mm;min-height:297mm;padding:12mm 14mm 10mm;font-size:11pt;margin:0}
  .sh-tbl tr{page-break-inside:avoid}
}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
<form id="gateForm" autocomplete="off">
<h2>Al Atraj Documents</h2>
<label class="f">PIN<input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" required></label>
<label class="check"><input id="pinRemember" type="checkbox" checked> Remember on this device</label>
<div class="err" id="pinErr" role="alert"></div>
<button class="btn pri" type="submit">Open</button>
</form>
</div>

<header class="top noprint">
<div class="in">
<h1>Al Atraj Documents</h1>
<div class="search">
<input id="q" type="search" placeholder="Find by number, customer or phone" aria-label="Find a saved document" autocomplete="off">
<div class="results" id="results" hidden></div>
</div>
</div>
</header>
<div class="banner noprint" id="banner" hidden></div>

<main class="app">
<section class="formcol noprint" aria-label="Document form">

<div class="card">
<label class="f typebox">Document type
<select id="type"></select></label>
</div>

<div class="card" id="convCard" hidden>
<button type="button" class="btn pri" id="convBtn" style="width:100%"></button>
<p class="pay-hint" style="margin:8px 0 0">Copies the customer and all items into a new Tax Invoice with its own number. The quotation stays as it is.</p>
</div>

<div class="card">
<h2 id="partyTitle">Customer</h2>
<div class="grid2">
<label class="f" style="grid-column:1/-1;position:relative">Name<input id="party_name" type="text" autocomplete="off"><div class="sugg" id="custBox" hidden></div></label>
<label class="f" style="grid-column:1/-1">Address<textarea id="party_address" rows="2"></textarea></label>
<label class="f">Mobile number<input id="party_phone" type="tel" inputmode="tel"></label>
</div>
</div>

<div class="card">
<h2>Document details</h2>
<div class="grid2">
<label class="f"><span id="numLabel">Number</span><input id="number" type="text" autocomplete="off"></label>
<label class="f">Date<input id="date" type="date"></label>
<label class="f"><span id="refLabel">Details</span><input id="reference" type="text" placeholder="for example QUOTE NO AAT5091"></label>
<label class="f">Salesperson<input id="salesperson" type="text"></label>
<label class="f" style="grid-column:1/-1">Subject<input id="subject" type="text" placeholder="for example CARPET &amp; CURTAIN WORK"></label>
</div>
</div>

<div class="card">
<h2>Message</h2>
<div class="grid2">
<label class="f">Greeting<select id="greeting"><option>Dear Sir</option><option>Dear Madam</option><option>Dear Sir / Madam</option><option>None</option></select></label>
<label class="f" style="grid-column:1/-1">Message<textarea id="message" rows="3"></textarea></label>
</div>
</div>

<div class="card">
<h2>Items</h2>
<div id="items"></div>
<label class="f" style="margin-bottom:8px">Add from price list<select id="pricePick"><option value="">Choose an item…</option></select></label>
<button type="button" class="btn add" id="addItem">+ Add blank item</button>
<div class="totals" id="totals"></div>
</div>

<div class="card">
<h2 id="noteTitle">Fixing / delivery</h2>
<div class="grid2">
<label class="f">Choose<select id="notePick"></select></label>
<label class="f" style="grid-column:1/-1">Text on the document<textarea id="note" rows="2"></textarea></label>
</div>
<label class="check" id="vatRow"><input id="vat_on" type="checkbox"><span id="vatText">Add 5% VAT</span></label>
</div>

<div class="card" id="payCard" hidden>
<h2>Payments</h2>
<div id="payBody"></div>
</div>

<div class="card">
<h2>Signatures</h2>
<label class="check"><input id="show_stamp" type="checkbox"> Show company stamp above ISSUED BY</label>
<label class="f">Stamp image (stays on this device only)<input id="stampFile" type="file" accept="image/*"></label>
</div>

<div class="card" style="background:none;border:0;padding:0">
<button type="button" class="btn" id="newBtn">Clear and start a new document</button>
</div>
</section>

<section class="prevcol" aria-label="A4 preview">
<div class="prevhead noprint"><strong>A4 preview</strong><span id="status"></span></div>
<div class="paper-wrap" id="paperWrap"><div class="sheet" id="sheet"></div></div>
</section>
</main>

<div class="bar noprint">
<div class="in">
<button type="button" class="btn pri" id="saveBtn">Save</button>
<button type="button" class="btn" id="printBtn">Print</button>
<button type="button" class="btn wa" id="shareBtn">Share on WhatsApp</button>
<button type="button" class="btn" id="pdfBtn">PDF</button>
</div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ---------- settings (company details and API link live in office-config.js) ---------- */
const CFG = window.OFFICE_CONFIG || {};
const API_URL = CFG.API_URL || '';
const EXTRAS = Object.assign({ types: [], bank: [], terms: [] }, CFG.INVOICE_EXTRAS || {});
function belowRiyals(n) {
  const a = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const t = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  const w = (x) => x < 20 ? a[x] : t[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : '');
  const h = (x) => (x >= 100 ? a[Math.floor(x / 100)] + ' hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? w(x % 100) : '');
  if (n === 0) return 'zero';
  const parts = []; const sc = [[1e9, 'billion'], [1e6, 'million'], [1e3, 'thousand'], [1, '']];
  sc.forEach(([v, name]) => { const q = Math.floor(n / v); if (q) { parts.push(h(q) + (name ? ' ' + name : '')); n -= q * v; } });
  return parts.join(' ');
}
function amountWords(x) {
  const total = Math.round(Number(x) * 1000); if (!isFinite(total) || total <= 0) return '';
  const r = Math.floor(total / 1000); const b = total % 1000;
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  let out = r ? cap(belowRiyals(r)) + ' Omani riyal' + (r === 1 ? '' : 's') : '';
  if (b) out += (out ? ' and ' : '') + (r ? belowRiyals(b) : cap(belowRiyals(b))) + ' baisa';
  return out + ' only';
}
const VAT_RATE = Number(CFG.VAT_RATE != null ? CFG.VAT_RATE : 5);
const CURRENCY = CFG.CURRENCY || 'OMR';
const COMPANY = Object.assign({
  name: 'AL-ATRAJ TRADING EST.',
  lines: ['P.O. Box: 2368, PC, 112 Ruwi, Sultanate of Oman', 'C.R. No: 1/15915/1', 'VATIN: OM1100238626', 'Tel/Fax: +968 24836556/92150208', 'Email: alatrajtrading@yahoo.com'],
  logo: 'images/logo.png'
}, CFG.COMPANY || {});

const FIX_NOTES = ['ALL WITH SUPPLY AND FIXING', 'SUPPLY ONLY', 'SUPPLY AND DELIVERY', 'DELIVERY ONLY', 'Custom text'];
const PAY_NOTES = ['CASH', 'BANK TRANSFER', 'CHEQUE', 'CARD', 'Custom text'];
const DOCS = {
  'Quotation': { title: 'QUOTATION', num: 'Quotation Number', ref: 'Details', party: 'Customer', showPartyLabel: false, prices: true, vat: true, greeting: 'Dear Sir',
    msg: 'We are pleased to quote our best price which is required by our office. Hope our price is competitive and reasonable. We are looking forward to your order confirmation.',
    noteTitle: 'Fixing / delivery', notes: FIX_NOTES },
  'Tax Invoice': { title: 'TAX INVOICE', num: 'Invoice Number', ref: 'Details', party: 'Customer', showPartyLabel: false, prices: true, vat: true, greeting: 'Dear Sir',
    msg: 'We are pleased to submit our bill for payment against the above detailed below.',
    noteTitle: 'Fixing / delivery', notes: FIX_NOTES },
  'Proforma Invoice': { title: 'PROFORMA INVOICE', num: 'Proforma Number', ref: 'Details', party: 'Customer', showPartyLabel: false, prices: true, vat: true, greeting: 'Dear Sir',
    msg: 'We are pleased to submit our proforma invoice against the items detailed below.',
    noteTitle: 'Fixing / delivery', notes: FIX_NOTES },
  'Delivery Note': { title: 'DELIVERY NOTE', num: 'Delivery Note Number', ref: 'Details', party: 'Customer', showPartyLabel: false, prices: false, vat: false, greeting: 'Dear Sir',
    msg: 'We are delivering the items detailed below.',
    noteTitle: 'Delivery details', notes: ['DELIVERY ONLY', 'DELIVERY AND FIXING', 'COLLECTED FROM SHOP', 'Custom text'] },
  'Payment Receipt': { title: 'PAYMENT RECEIPT', num: 'Receipt Number', ref: 'Against', party: 'Received from', showPartyLabel: true, prices: true, vat: false, greeting: 'None',
    msg: 'Received with thanks the amount detailed below.',
    noteTitle: 'Payment method', notes: PAY_NOTES },
  'Cash Memo': { title: 'CASH MEMO', num: 'Memo Number', ref: 'Details', party: 'Customer', showPartyLabel: false, prices: true, vat: true, greeting: 'None',
    msg: '',
    noteTitle: 'Payment method', notes: PAY_NOTES },
  'Purchase Order': { title: 'PURCHASE ORDER', num: 'PO Number', ref: 'Details', party: 'Supplier', showPartyLabel: true, prices: true, vat: false, greeting: 'Dear Sir',
    msg: 'Please supply the items detailed below.',
    noteTitle: 'Delivery terms', notes: ['DELIVER TO OUR SHOP', 'DELIVER TO SITE', 'COLLECTION BY US', 'Custom text'] }
};
const TYPES = Object.keys(DOCS);

/* ---------- small helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } };
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function changeType(type) {
  const old = DOCS[doc.type]; const nw = DOCS[type];
  const wasSaved = mode === 'update';
  const oldNumber = doc.number; const oldType = doc.type;
  if (doc.message === old.msg) doc.message = nw.msg;
  if (old.notes.includes(doc.note) || doc.note === '') doc.note = nw.notes[0] === 'Custom text' ? '' : nw.notes[0];
  if (doc.greeting === old.greeting) doc.greeting = nw.greeting;
  doc.vat_on = nw.vat; doc.type = type;
  if (wasSaved) {
    // converting a saved document (for example quotation to invoice) makes a new document
    mode = 'new'; numberAuto = true; doc.number = '';
    if (!doc.reference && oldType === 'Quotation') doc.reference = 'QUOTE NO ' + oldNumber;
    if (!doc.reference && oldType === 'Proforma Invoice') doc.reference = 'PROFORMA NO ' + oldNumber;
    doc.date = todayISO();

/* ---------- save and search ---------- */
function validate() {
  if (!String(doc.number).trim() && !API_URL) { toast('Type a number first.', { err: true }); return false; }
  if (!String(doc.party_name).trim()) { toast('Enter the ' + DOCS[doc.type].party.toLowerCase() + ' name.', { err: true }); $('#party_name').focus(); return false; }
  if (!doc.items.some((it) => String(it.description || '').trim())) { toast('Add at least one item.', { err: true }); return false; }
  return true;
}
async function saveDoc(quiet) {
  if (!validate()) return false;
  if (!API_URL) { if (!quiet) toast('Saving is off because no API link is set. You can still print and share.', { err: true }); return true; }
  const btn = $('#saveBtn'); btn.disabled = true; setStatus('Saving…');
  try {
    let r = await api('save', { doc: serial(), mode });
    if (r.error === 'duplicate') {
      if (confirm(r.message + '\nReplace the saved one with this?')) r = await api('save', { doc: serial(), mode: 'update' });
      else { setStatus(''); return false; }
    }
    if (r.error === 'pin') { showGate('PIN is not correct.'); return false; }
    if (!r.ok) { toast('Could not save: ' + (r.message || r.error), { err: true }); setStatus(''); return false; }
    doc.number = r.number; $('#number').value = r.number; mode = 'update'; numberAuto = false; dirty = false; saved = true;
    renderPreview(); setStatus('Saved ' + r.number); rememberCustomer(); refreshSide();
    if (!quiet) toast((r.updated ? 'Updated ' : 'Saved ') + doc.type + ' ' + r.number);
    return true;
  } catch (e) {
    setStatus(''); toast('No connection. Not saved.', { err: true }); return false;
  } finally { btn.disabled = false; }
}
function serial() { return JSON.parse(JSON.stringify(doc)); }
async function ensureSaved() {
  if (!validate()) return false;
  if (!API_URL || (!dirty && saved)) return true;
  const ok = await saveDoc(true);
  if (ok) return true;
  return confirm('This document could not be saved. Continue anyway?');
}

function chipHTML(x) {
  if (!x.status) return '';
  const t = x.status === 'paid' ? 'Paid' : x.status === 'partial' ? 'Part paid · due ' + money(x.balance) : 'Unpaid';
  return '<span class="chip ' + x.status + '">' + t + '</span>';
}
function bindSearch() {
  const q = $('#q'); const box = $('#results'); let timer; let tab = 'recent';
  const run = async () => {
    if (!API_URL) { box.hidden = false; box.innerHTML = '<div class="empty">Search needs the API link in office-config.js.</div>'; return; }
    box.hidden = false;
    const text = q.value.trim();
    const action = tab === 'unpaid' ? 'unpaid' : (text ? 'search' : 'recent');
    const tabs = document.createElement('div'); tabs.className = 'tabs';
    [['recent', 'Search / recent'], ['unpaid', 'Unpaid invoices']].forEach(([k, label]) => {
      const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = label; bt.setAttribute('aria-pressed', String(tab === k));
      bt.addEventListener('click', () => { tab = k; run(); }); tabs.append(bt);
    });
    box.replaceChildren(tabs, Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Loading…' }));
    try {
      const r = await api(action, { q: text });
      if (r.error === 'pin') { showGate('PIN is not correct.'); return; }
      if (!r.ok) { box.replaceChildren(tabs, Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Could not load.' })); return; }
      const out = [tabs];
      if (!r.results.length) out.push(Object.assign(document.createElement('div'), { className: 'empty', textContent: tab === 'unpaid' ? 'No unpaid invoices. Everything is paid.' : 'No document found.' }));
      if (tab === 'unpaid' && r.results.length) {
        const due = r.results.reduce((a, x) => a + (Number(x.balance) || 0), 0);
        out.push(Object.assign(document.createElement('div'), { className: 'sum', textContent: r.results.length + ' unpaid · total due ' + CURRENCY + ' ' + money(due) + ' (oldest first)' }));
      }
      r.results.forEach((x) => {
        const b = document.createElement('button'); b.type = 'button';
        b.innerHTML = '<div class="n">' + esc(x.number) + ' · ' + esc(x.type) + chipHTML(x) + '</div><div class="m">' + esc(fmtDate(x.date)) + ' · ' + esc(x.party_name) + ' · ' + CURRENCY + ' ' + money(x.total || 0) + '</div>';
        b.addEventListener('click', () => { box.hidden = true; q.value = ''; openDoc(x.type, x.number); });
        out.push(b);
      });
      box.replaceChildren(...out);
    } catch (e) { box.replaceChildren(tabs, Object.assign(document.createElement('div'), { className: 'empty', textContent: 'No connection.' })); }
  };
  q.addEventListener('input', () => { tab = 'recent'; clearTimeout(timer); timer = setTimeout(run, 300); });
  q.addEventListener('focus', run);
  document.addEventListener('click', (e) => { if (e.target.isConnected && !e.target.closest('.search')) box.hidden = true; });
  q.addEventListener('keydown', (e) => { if (e.key === 'Escape') { box.hidden = true; q.blur(); } });
}

/* ---------- customers (autofill) ---------- */
let CUSTOMERS = [];
function renderCustomers() { showSugg(); }
function showSugg() {
  const box = $('#custBox'); const inp = $('#party_name');
  if (document.activeElement !== inp || !CUSTOMERS.length) { box.hidden = true; return; }
  const q = inp.value.trim().toLowerCase();
  const list = CUSTOMERS.filter((c) => !q || c.name.toLowerCase().includes(q) || String(c.phone).includes(q)).slice(0, 8);
  if (!list.length || (list.length === 1 && list[0].name.toLowerCase() === q)) { box.hidden = true; return; }
  box.replaceChildren(...list.map((c) => {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<div class="n">' + esc(c.name) + '</div><div class="m">' + esc([c.phone, c.address].filter(Boolean).join(' · ')) + '</div>';
    b.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus so the list does not vanish first
    b.addEventListener('click', () => {
      box.hidden = true;
      doc.party_name = c.name; $('#party_name').value = c.name;
      doc.party_address = c.address; $('#party_address').value = c.address;
      doc.party_phone = c.phone; $('#party_phone').value = c.phone;
      touch();
    });
    return b;
  }));
  box.hidden = false;
}
async function loadCustomers() {
  if (!API_URL) return;
  try {
    const r = await api('customers');
    if (r.ok) { CUSTOMERS = r.customers; renderCustomers(); }
    else if (r.error === 'unknown_action') toast('Customer list, payments and unpaid list need the new Code.gs. Paste it in Apps Script, run setup, then Deploy > Manage deployments > New version.', { err: true });
  } catch (e) { /* offline: no suggestions */ }
}
function rememberCustomer() {
  const name = String(doc.party_name || '').trim(); if (!name) return;
  const i = CUSTOMERS.findIndex((c) => c.name.toLowerCase() === name.toLowerCase());
  const rec = { name, address: doc.party_address || '', phone: doc.party_phone || '' };
  if (i >= 0) CUSTOMERS[i] = rec; else { CUSTOMERS.push(rec); CUSTOMERS.sort((a, b) => a.name.localeCompare(b.name)); }
  renderCustomers();
}
function autofillCustomer() {
  const name = $('#party_name').value.trim().toLowerCase(); if (!name) return;
  const c = CUSTOMERS.find((x) => x.name.toLowerCase() === name); if (!c) return;
  if (!doc.party_address && c.address) { doc.party_address = c.address; $('#party_address').value = c.address; }
  if (!doc.party_phone && c.phone) { doc.party_phone = c.phone; $('#party_phone').value = c.phone; }
  doc.party_name = c.name; $('#party_name').value = c.name; touch();
}

async function refreshPay() {
  const card = $('#payCard'); const body = $('#payBody');
  if (!API_URL || !PAYABLE.includes(doc.type)) { card.hidden = true; return; }
  card.hidden = false;
  if (mode !== 'update') { body.innerHTML = '<p class="pay-hint">Save this document first. Then you can record payments here.</p>'; return; }
  const my = ++payToken;
  body.innerHTML = '<p class="pay-hint">Loading payments…</p>';
  try {
    const r = await api('payments', { type: doc.type, number: doc.number });
    if (my !== payToken) return;
    if (!r.ok) { body.innerHTML = '<p class="pay-hint">Payments could not be loaded.</p>'; return; }
    renderPay(r);
  } catch (e) { if (my === payToken) body.innerHTML = '<p class="pay-hint">No connection.</p>'; }
}
function renderPay(r) {
  const body = $('#payBody');
  const label = r.status === 'paid' ? 'Paid in full' : r.status === 'partial' ? 'Part paid' : 'Unpaid';
  body.innerHTML =
    '<div class="pay-sum"><div><span>Saved total</span><span>' + CURRENCY + ' ' + money(r.total) + '</span></div>' +
    '<div><span>Received</span><span>' + CURRENCY + ' ' + money(r.paid) + '</span></div>' +
    '<div class="b"><span>Balance due <span class="chip ' + r.status + '">' + label + '</span></span><span>' + CURRENCY + ' ' + money(r.balance) + '</span></div></div>' +
    (dirty ? '<p class="pay-hint">You changed this document. Press Save so the total above is up to date.</p>' : '') +
    '<ul class="pay-list" id="payList"></ul>' +
    '<div class="grid2">' +
    '<label class="f">Amount (' + CURRENCY + ')<input id="payAmt" type="text" inputmode="decimal" value="' + (r.balance > 0 ? String(r.balance) : '') + '"></label>' +
    '<label class="f">Method<select id="payMethod"><option>Cash</option><option>Bank transfer</option><option>Cheque</option><option>Card</option></select></label>' +
    '<label class="f">Date<input id="payDate" type="date" value="' + todayISO() + '"></label>' +
    '<label class="f">Note<input id="payNote" type="text" placeholder="cheque number, reference"></label></div>' +
    '<button type="button" class="btn pri" id="payBtn" style="width:100%;margin-top:12px">Add payment</button>';
  const list = $('#payList');
  if (!r.payments.length) list.innerHTML = '<li class="pay-hint">No payment yet.</li>';
  r.payments.forEach((p) => {
    const li = document.createElement('li');
    li.innerHTML = '<span>' + esc(fmtDate(p.date)) + ' · ' + esc(p.method || '') + (p.note ? ' · ' + esc(p.note) : '') + '</span><b>' + money(p.amount) + '</b>';
    const del = document.createElement('button'); del.type = 'button'; del.textContent = '×'; del.setAttribute('aria-label', 'Remove this payment');
    del.addEventListener('click', async () => {
      if (!confirm('Remove this payment of ' + money(p.amount) + '?')) return;
      try { const x = await api('delpay', { id: p.id }); if (x.ok) renderPay(x); else toast('Could not remove.', { err: true }); } catch (e) { toast('No connection.', { err: true }); }
    });
    li.append(del); list.append(li);
  });
  $('#payBtn').addEventListener('click', async () => {
    const amt = Number(String($('#payAmt').value).replace(/,/g, ''));
    if (!isFinite(amt) || amt <= 0) { toast('Enter the amount received.', { err: true }); return; }
    if (amt > r.balance + 0.0005 && !confirm('This is more than the balance of ' + money(r.balance) + '. Add it anyway?')) return;
    const bt = $('#payBtn'); bt.disabled = true;
    try {
      const x = await api('pay', { type: doc.type, number: doc.number, amount: amt, method: $('#payMethod').value, date: $('#payDate').value, note: $('#payNote').value });
      if (x.ok) { renderPay(x); toast('Payment of ' + money(amt) + ' added.'); } else { toast('Could not add: ' + (x.message || x.error), { err: true }); bt.disabled = false; }
    } catch (e) { toast('No connection.', { err: true }); bt.disabled = false; }
  });
}
async function openDoc(type, number) {
  try {
    const r = await api('get', { type, number });
    if (!r.ok) { toast('Document not found.', { err: true }); return; }
    doc = Object.assign(blankDoc(r.doc.type), r.doc);
    if (!doc.items.length) doc.items = [{ description: '', qty: '', price: '' }];
    mode = 'update'; numberAuto = false; dirty = false; saved = true;
    fillForm(); renderPreview(); setStatus('Opened ' + doc.number);
    toast('Opened ' + doc.type + ' ' + doc.number + '. Print or share it from the buttons below.');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { toast('No connection.', { err: true }); }
}

/* ---------- print, PDF, share ---------- */
const fileBase = () => (doc.type + '-' + (doc.number || 'draft')).replace(/[^\w.-]+/g, '_');
async function onPrint() {
  if (!(await ensureSaved())) return;
  const old = document.title; document.title = fileBase();
  const restore = () => { document.title = old; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  fitPreview(); window.print();
}
async function makePdfBlob() {
  if (!window.html2canvas || !window.jspdf) throw new Error('PDF tools did not load. Check the internet connection and reload.');
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-12000px;top:0;width:794px;background:#fff';
  const clone = $('#sheet').cloneNode(true); clone.style.transform = 'none'; clone.id = 'sheetClone';
  host.append(clone); document.body.append(host);
  try {
    const canvas = await window.html2canvas(clone, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
    const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'p' });
    const pageH = Math.floor(canvas.width * 297 / 210); let y = 0; let first = true;
    while (y < canvas.height - 2) {
      const h = Math.min(pageH, canvas.height - y);
      const part = document.createElement('canvas'); part.width = canvas.width; part.height = h;
      const g = part.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, part.width, h); g.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (!first) pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, h * 210 / canvas.width);
      first = false; y += pageH;
    }
    return pdf.output('blob');
  } finally { host.remove(); }
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function onPdf() {
  if (!(await ensureSaved())) return;
  const b = $('#pdfBtn'); b.disabled = true; setStatus('Making PDF…');
  try { download(await makePdfBlob(), fileBase() + '.pdf'); setStatus(''); }
  catch (e) { toast(e.message || 'Could not make the PDF.', { err: true }); setStatus(''); }
  finally { b.disabled = false; }
}
async function onShare() {
  if (!(await ensureSaved())) return;
  const b = $('#shareBtn'); b.disabled = true; setStatus('Preparing PDF…');
  let file;
  try { file = new File([await makePdfBlob()], fileBase() + '.pdf', { type: 'application/pdf' }); }
  catch (e) { toast(e.message || 'Could not make the PDF.', { err: true }); setStatus(''); b.disabled = false; return; }
  setStatus(''); b.disabled = false;
  const text = DOCS[doc.type].title.charAt(0) + DOCS[doc.type].title.slice(1).toLowerCase() + ' ' + (doc.number || '') + ' from Al Atraj Trading Est.';
  const send = async () => {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: text, text }); return; }
      catch (e) {
        if (e && e.name === 'AbortError') return;
        toast('Tap to send the PDF.', { sticky: true, action: { label: 'Share now', run: send } }); return;
      }
    }
    // computers and browsers that cannot share files: save the PDF and open WhatsApp
    download(file, file.name);
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
    toast('PDF saved. Attach it in the WhatsApp chat.', { ms: 7000 });
  };
  toast('PDF ready.', { sticky: true, action: { label: 'Share now', run: send } });
  send();
}

/* ---------- PIN gate ---------- */
function showGate(msg) { $('#gate').hidden = false; $('#pinErr').textContent = msg || ''; $('#pinIn').value = ''; setTimeout(() => $('#pinIn').focus(), 50); }
async function tryPin(pin) {
  PIN_VALUE = pin;
  const r = await api('auth');
  if (r.ok) { $('#gate').hidden = true; loadCustomers(); return true; }
  return false;
}
$('#gateForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const pin = $('#pinIn').value.trim(); $('#pinErr').textContent = 'Checking…';
  try {
    if (await tryPin(pin)) { if ($('#pinRemember').checked) lsSet('altraj_pin', pin); else lsSet('altraj_pin', ''); suggestNumber(); }
    else { $('#pinErr').textContent = 'PIN is not correct.'; }
  } catch (err) { $('#pinErr').textContent = 'No connection. Try again.'; }
});

/* ---------- start ---------- */
/* ---------- price list: built-in list, replaced by the sheet tab "PriceList" when it loads ---------- */
let PRICES = [];
function expandPrice(r) {
  const prices = String(r.price).split('/').map((x) => x.trim()).filter(Boolean);
  const m = String(r.item).match(/^(.*?):\s*(.*)$/);
  const sizes = m ? m[2].split('/').map((x) => x.trim()) : [];
  if (prices.length > 1 && m && sizes.length === prices.length) return prices.map((p, i) => ({ label: m[1] + ' ' + sizes[i], price: p, unit: r.unit }));
  if (prices.length > 1) return prices.map((p) => ({ label: r.item + ' (' + p + ')', desc: r.item, price: p, unit: r.unit }));
  return [{ label: r.item, price: prices[0] || '', unit: r.unit }];
}
function buildPricePick() {
  const sel = $('#pricePick'); sel.length = 1; PRICES = [];
  const groups = {};
  (window.PRICE_LIST_ACTIVE || []).forEach((r) => {
    const g = r.category || 'Other';
    (groups[g] = groups[g] || []).push(...expandPrice(r));
  });
  Object.keys(groups).forEach((g) => {
    const og = document.createElement('optgroup'); og.label = g;
    groups[g].forEach((o) => {
      PRICES.push(o);
      const op = document.createElement('option'); op.value = String(PRICES.length - 1);
      op.textContent = o.label + '  |  ' + o.price + ' ' + (o.unit || ''); og.append(op);
    });
    sel.append(og);
  });
}
function parseCSV(text) {
  const rows = []; let row = []; let cur = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
async function loadPriceSheet() {
  const id = window.SITE_CONFIG && window.SITE_CONFIG.SHEET_ID;
  if (!id) return;
  try {
    const res = await fetch('https://docs.google.com/spreadsheets/d/' + encodeURIComponent(id) + '/gviz/tq?tqx=out:csv&headers=1&sheet=PriceList');
    if (!res.ok) return;
    const rows = parseCSV(await res.text());
    const head = (rows[0] || []).map((h) => h.trim().toLowerCase());
    const list = rows.slice(1).filter((r) => r.some((x) => x.trim() !== ''))
      .map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])))
      .filter((r) => r.item && r.price && r.unit !== undefined);
    if (list.length) { window.PRICE_LIST_ACTIVE = list; buildPricePick(); }
  } catch (e) { /* keep the built-in list */ }
}
window.PRICE_LIST_ACTIVE = window.PRICE_LIST_DEFAULT || [];
$('#pricePick').addEventListener('change', (e) => {
  const o = PRICES[Number(e.target.value)]; e.target.value = '';
  if (!o) return;
  const withPrice = DOCS[doc.type].prices;
  const item = { description: o.desc || o.label, qty: '', price: withPrice ? o.price : '' };
  const empty = doc.items.findIndex((it) => !String(it.description || '').trim() && !String(it.price || '').trim());
  if (empty >= 0) doc.items[empty] = item; else doc.items.push(item);
  renderItems(); touch();
  const rows = document.querySelectorAll('#items .item');
  const row = rows[empty >= 0 ? empty : rows.length - 1];
  const q = row && row.querySelector('input[data-k=qty]'); if (q) { q.placeholder = (o.unit || '').replace(/^Per\s+/i, 'e.g. 12 '); q.focus(); }
});
buildPricePick(); loadPriceSheet();

bind(); fillForm(); renderPreview();
if (!API_URL) {
  const b = $('#banner'); b.hidden = false;
  b.textContent = 'Saving and search are off: set API_URL in office-config.js (see the setup steps in Code.gs). Printing and sharing work without it.';
} else {
  (async () => {
    try {
      if (PIN_VALUE && await tryPin(PIN_VALUE)) { suggestNumber(); return; }
      showGate();
    } catch (e) { showGate('No connection. Check the internet and try again.'); }
  })();
}
